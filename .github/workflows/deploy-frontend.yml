name: Deploy frontend

# Push to main touching frontend/ -> publish to Cloudflare Pages project
# `predmark`. The dashboard is static: no build step, no bundler, no
# node_modules. It talks to Cloud Run through the portal proxy.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      # The API base is injected at deploy time rather than hard-coded, so
      # the same files work behind the portal proxy or against a direct URL
      # without an edit. Defaults to the proxy path when the variable is not
      # set.
      - name: Inject API base
        run: |
          API_BASE="${{ vars.PREDMARK_API_BASE }}"
          if [ -z "$API_BASE" ]; then
            API_BASE="/api/predmark"
          fi
          cat > frontend/config.js <<EOF
          // Generated at deploy time. Do not edit by hand.
          window.PREDMARK_API = "${API_BASE}";
          EOF
          # config.js must load before the page scripts that read it.
          sed -i 's|<script src="app.js"></script>|<script src="config.js"></script>\n<script src="app.js"></script>|' frontend/index.html
          sed -i 's|<script src="settings.js"></script>|<script src="config.js"></script>\n<script src="settings.js"></script>|' frontend/settings.html

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend --project-name=predmark --branch=main
